name: CI

on:
  push:
    branches: ["main", "security/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Summarize dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e "const report = require('./audit-report.json'); const items = Object.entries(report.vulnerabilities || {}); console.log(items.map(([name, item]) => name + ': ' + item.severity + ' (fix: ' + JSON.stringify(item.fixAvailable) + ')').join('\\n') || 'No dependency advisories found')"
          rm -f audit-report.json

  ml-service:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q ml-adr-service
