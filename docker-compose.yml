services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/smart-care-assistant
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in the root .env file}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in the root .env file}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartcare-network

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - smartcare-network

  ml-adr-service:
    build:
      context: ./ml-adr-service
    expose:
      - "6001"
    environment:
      PORT: 6001
      FLASK_DEBUG: "false"
    restart: unless-stopped
    networks:
      - smartcare-network

networks:
  smartcare-network:
    driver: bridge

volumes:
  mongodb_data:
